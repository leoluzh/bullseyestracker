org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# KSP still registers generated sources via the old kotlin.sourceSets DSL, which AGP 9's
# built-in Kotlin rejects by default until KSP adopts the new Sources API on androidComponents.
# See https://developer.android.com/r/tools/built-in-kotlin.
android.disallowKotlinSourceSets=false
