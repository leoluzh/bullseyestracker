name: Update Changelog

on:
  pull_request:
    types: [closed]
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: changelog-master
  cancel-in-progress: false

jobs:
  update_changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Update CHANGELOG.md
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: python3 .github/scripts/update_changelog.py

      - name: Commit and push
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- CHANGELOG.md; then
            echo "No changelog changes to commit."
            exit 0
          fi

          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG.md for #${PR_NUMBER}"

          for attempt in 1 2 3; do
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Push rejected, retrying with rebase (attempt ${attempt})..."
            git fetch origin master
            git rebase origin/master
          done
          echo "Failed to push changelog update after retries." >&2
          exit 1
