name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, unit test, lint
        run: ./gradlew build --console=plain

      # Instrumented tests (OpenCvBoardDetectorTest, OpenCvDartDetectorTest,
      # PerformanceBenchmarkTest under cv/src/androidTest) need a running emulator and are not
      # wired up here — they also depend on fixture images not yet added (tasks.md T044).
      # Add a reactivecircus/android-emulator-runner job once both of those exist.

      - name: Upload test/lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/ktlint/
            **/build/reports/lint-results*.html
          if-no-files-found: ignore
